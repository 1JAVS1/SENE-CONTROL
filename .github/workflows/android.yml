name: Build SENE.CONECT release APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Create temporary release signing key
        run: keytool -genkeypair -v -keystore "$RUNNER_TEMP/sene-release.jks" -storepass sene-release -keypass sene-release -alias sene -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SENE.CONECT, OU=Mobile, O=SENE, L=Jalisco, ST=Jalisco, C=MX"
      - name: Build signed release APK
        env:
          SENE_KEYSTORE: ${{ runner.temp }}/sene-release.jks
          SENE_STORE_PASSWORD: sene-release
          SENE_KEY_PASSWORD: sene-release
          SENE_KEY_ALIAS: sene
        run: gradle --no-daemon assembleRelease
      - name: Verify APK
        run: "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SENE-CONECT-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
