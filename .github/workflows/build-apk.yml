name: Inspect original SENE project
on:
  push:
    branches: [redisenio-sene-conect]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore original project
        run: |
          base64 -d project.zip.b64 > /tmp/original.zip
          unzip -o /tmp/original.zip -d /tmp/original
          echo "===== APP BUILD ====="
          cat /tmp/original/app/build.gradle
          echo "===== MANIFEST ====="
          cat /tmp/original/app/src/main/AndroidManifest.xml
          echo "===== MAIN ACTIVITY ====="
          cat /tmp/original/app/src/main/java/com/sene/taller/MainActivity.java
          echo "===== MAIN LAYOUT ====="
          cat /tmp/original/app/src/main/res/layout/activity_main.xml
          echo "===== ITEM LAYOUT ====="
          cat /tmp/original/app/src/main/res/layout/item_taller.xml
          echo "===== STRINGS ====="
          cat /tmp/original/app/src/main/res/values/strings.xml
          echo "===== RESOURCE TREE ====="
          find /tmp/original/app/src/main/res -maxdepth 3 -type f
