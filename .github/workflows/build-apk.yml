name: Build SENE CONECT APK
on:
  push:
    branches: [redisenio-sene-conect]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Build APK
        run: gradle assembleDebug
      - name: Package APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/SENE-CONECT.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SENE-CONECT
          path: release/SENE-CONECT.apk
          if-no-files-found: error
